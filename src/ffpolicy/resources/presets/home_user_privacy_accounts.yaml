id: home_user_privacy_accounts
name: Home User - Privacy (Firefox Accounts)
description: >-
  Privacy-hardened profile for home users who want to stay inside Mozilla's own
  ecosystem: built-in Password Manager + Firefox Sync (Firefox Account) for
  credentials, and Mozilla VPN for network-level protection. Disables telemetry,
  enforces strict tracking protection and DNS-over-HTTPS, clears data on exit, and
  ships a curated set of privacy extensions the user can disable individually.
  Compare with home_user_privacy_proton, which swaps the Mozilla-account pieces
  for Proton Pass/Proton VPN instead.
source: >-
  Mozilla Firefox Security Hardening Guide, NIST SP 800-53, Mozilla's Privacy & Security
  Recommendations
values:
  # Privacy & Telemetry
  DisableTelemetry: true
  DisableFirefoxStudies: true
  DisableFeedbackCommands: true
  DisablePocket: true

  # Content Blocking & Tracking Protection
  Preferences:
    browser.contentblocking.category:
      Value: strict
      Status: locked
  EnableTrackingProtection:
    Cryptomining: true
    Fingerprinting: true
  SearchSuggestEnabled: false
  NetworkPrediction: false
  SearchEngines:
    Default: DuckDuckGo

  # Network Security
  SSLVersionMin: tls1.2
  DNSOverHTTPS:
    Enabled: true
  DisabledCiphers:
    TLS_RSA_WITH_3DES_EDE_CBC_SHA: true

  # Credentials & Sync - use Firefox's own Password Manager + Firefox Account
  PasswordManagerEnabled: true
  DisableFirefoxAccounts: false

  # Data Cleanup
  SanitizeOnShutdown:
    Cache: true
    Cookies: true
    History: true
    Sessions: true
    Locked: true

  # Permissions - block by default, sites can still prompt for camera/mic
  Permissions:
    Autoplay:
      Default: block-audio-video
    Geolocation:
      Default: block
    Notifications:
      Default: block

  # UI Cleanup
  UserMessaging:
    ExtensionRecommendations: false
    FeatureRecommendations: false
  FirefoxHome:
    SponsoredTopSites: false
    Pocket: false
    SponsoredPocket: false
    Snippets: false

  # Extensions - allow user installs, plus a curated privacy set installed but
  # left enabled/disableable by the user (installation_mode: normal_installed)
  InstallAddonsPermission:
    Default: true
  ExtensionSettings:
    uBlock0@raymondhill.net:
      installation_mode: normal_installed
      install_url: "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
    jid1-MnnxcxisBPnSXQ@jetpack:
      installation_mode: normal_installed
      install_url: "https://addons.mozilla.org/firefox/downloads/latest/privacy-badger17/latest.xpi"
    CookieAutoDelete@kennydo.com:
      installation_mode: normal_installed
      install_url: "https://addons.mozilla.org/firefox/downloads/latest/cookie-autodelete/latest.xpi"
    "{74145f27-f039-47ce-a470-a662b129930a}":
      installation_mode: normal_installed
      install_url: "https://addons.mozilla.org/firefox/downloads/latest/clearurls/latest.xpi"
    "@testpilot-containers":
      installation_mode: normal_installed
      install_url: "https://addons.mozilla.org/firefox/downloads/latest/multi-account-containers/latest.xpi"
    "{b86e4813-687a-43e6-ab65-0bde4ab75758}":
      installation_mode: normal_installed
      install_url: "https://addons.mozilla.org/firefox/downloads/latest/localcdn-fork-of-decentraleyes/latest.xpi"

rules:
  - id: HU-PRIV-FXA-1
    version: "1.0"
    severity: high
    policy: DisableTelemetry
    title: "Disable Mozilla Telemetry"
    description: >-
      Firefox sends telemetry data to Mozilla about browsing habits, hardware,
      and system configuration. Privacy-focused home users should opt out.
    recommendation: Disable telemetry and studies.

  - id: HU-PRIV-FXA-2
    version: "1.0"
    severity: high
    policy: EnableTrackingProtection
    title: "Enable Strong Tracking Protection"
    description: >-
      Tracking and fingerprinting enable identification and profiling across sites.
    recommendation: >-
      Enable strict tracking protection with fingerprinting and cryptomining
      prevention.

  - id: HU-PRIV-FXA-3
    version: "1.0"
    severity: medium
    policy: DNSOverHTTPS
    title: "Enable DNS-over-HTTPS"
    description: >-
      Standard DNS queries are unencrypted, allowing ISPs and network
      observers to see every domain visited.
    recommendation: Enable DNS-over-HTTPS to hide browsing from ISPs.

  - id: HU-PRIV-FXA-4
    version: "1.0"
    severity: high
    policy: SanitizeOnShutdown
    title: "Clear Browsing Data on Exit"
    description: >-
      Cached pages, cookies, and history can be recovered by other users on
      shared computers or by malware with local access.
    recommendation: Automatically clear cache, cookies, and history on exit.

  - id: HU-PRIV-FXA-5
    version: "1.0"
    severity: medium
    policy: PasswordManagerEnabled
    title: "Use Firefox's Built-in Password Manager with Sync"
    description: >-
      Rather than a third-party manager, this profile keeps Firefox's own
      Password Manager enabled and relies on Firefox Sync (Firefox Account)
      to keep credentials available across devices, encrypted end-to-end with
      the account's Sync key.
    recommendation: >-
      Sign in to a Firefox Account and enable Sync for passwords; use a
      strong, unique account password since it is the root of the Sync
      encryption key.

  - id: HU-PRIV-FXA-6
    version: "1.0"
    severity: medium
    policy: null
    title: "Install Mozilla VPN for Network-Level Privacy"
    description: >-
      Mozilla VPN is a system-level VPN client (not a browser extension) that
      encrypts all device traffic and hides the origin IP from sites and ISPs.
      It cannot be deployed or enforced via policies.json.
    recommendation: >-
      Install the Mozilla VPN desktop application separately and sign in with
      the same Firefox Account used for Sync.

  - id: HU-PRIV-FXA-7
    version: "1.0"
    severity: low
    policy: ExtensionSettings
    title: "Install Curated Privacy Extensions"
    description: >-
      uBlock Origin, Privacy Badger, Cookie AutoDelete, ClearURLs, Firefox
      Multi-Account Containers, and LocalCDN are installed automatically to
      give a strong default privacy posture, but left as normal_installed so
      the user may disable or remove any of them.
    recommendation: >-
      Review the installed extension set and disable any that conflict with
      sites you rely on.
    note: >-
      Extension IDs for Privacy Badger, Cookie AutoDelete, ClearURLs, Multi-
      Account Containers, and LocalCDN were not re-verified against AMO from
      this environment (outbound network to addons.mozilla.org was blocked) -
      confirm each GUID/install_url still resolves via `ffpolicy`'s AMO lookup
      or the AMO listing page before relying on this preset in production.

  - id: HU-PRIV-FXA-8
    version: "1.0"
    severity: low
    policy: SearchEngines
    title: "Set DuckDuckGo as the Default Search Engine"
    description: >-
      Firefox's default search engine varies by region/build and may send
      search queries to providers that build advertising profiles from them.
    recommendation: >-
      Set DuckDuckGo, a built-in search engine that does not track queries
      or build user profiles, as the default.
